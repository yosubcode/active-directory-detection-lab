title: ARP Cache Poisoning via Changed Ethernet Address (arpwatch)
id: 8f3b1c7a-2d4e-4a9b-9c15-7e6a0b3d9f21
status: experimental
description: |
  Detects ARP cache poisoning / man-in-the-middle activity on a LAN by matching
  arpwatch log entries that report a host's IP suddenly resolving to a new MAC
  address. arpwatch learns each IP's normal MAC and emits "changed ethernet
  address" (and repeated "flip flop") when a mapping changes, which is the
  signature of ARP spoofing tools such as arpspoof, ettercap, or bettercap.
references:
  - https://attack.mitre.org/techniques/T1557/002/
  - https://ee.lbl.gov/
author: yosubcode
date: 2026/11/06
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1557.002
logsource:
  product: linux
  service: syslog
detection:
  selection_program:
    - 'arpwatch'
  selection_event:
    - 'changed ethernet address'
    - 'flip flop'
  condition: selection_program and selection_event
falsepositives:
  - Legitimate NIC or hardware replacement on an existing IP
  - DHCP lease reassigning an IP to a different host
  - Failover between redundant interfaces sharing one IP (VRRP/HSRP)
  - A host moving between switch ports or bonded interfaces flapping
level: high
