title: Kerberoasting - Any Service Ticket for Decoy Account (Evasion-Resistant)
id: 7a1e9f20-0002-4a00-9000-000000000002
status: experimental
description: >
  Behavior-based Kerberoasting detection that survives the AES-downgrade-avoidance
  bypass. Fires on any Kerberos service ticket (TGS) request for the decoy service
  account svc-sql, regardless of encryption type. The account is a honey-SPN with
  no legitimate ticket traffic, so any request is suspicious. Mirrors Wazuh rule 100101.
references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://trustedsec.com/blog/the-art-of-bypassing-kerberoast-detections-with-orpheus
author: Yosub
date: 2026/10/30
tags:
  - attack.credential_access
  - attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    ServiceName: 'svc-sql'
  condition: selection
falsepositives:
  - None expected while svc-sql is a decoy (honey-SPN) with no running service.
  - A service account that is actually in use would require a frequency-based rule instead.
level: high
